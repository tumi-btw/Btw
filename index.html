<!doctype html>
<html lang="en">
<head>

<title>CineBox</title>
<style>
:root{--bg:#0f0d16;--card:#1b1828;--line:#2c2740;--txt:#f4f1fb;--mut:#a29cb8;--acc:#e8b04a;--bad:#ff6b6b;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color-scheme:dark}

.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(transparent,var(--bg))}
.pos{position:relative;z-index:1;width:56%;max-width:260px;aspect-ratio:2/3;object-fit:cover;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.55)}

.close{position:fixed;top:calc(12px + env(safe-area-inset-top));left:14px;width:40px;height:40px;border-radius:50%;background:rgba(15,13,22,.7);backdrop-filter:blur(8px);font-size:20px;z-index:11;text-align:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:12px 20px;border-radius:14px;background:var(--acc);color:#1a1200;font-weight:700;text-decoration:none;margin:8px 8px 0 0}.btn.alt{background:var(--card);color:var(--txt)}.btn.bad{background:rgba(255,107,107,.14);color:var(--bad)}.sv.on svg{fill:currentColor}
.panel{margin:0 16px 16px;padding:16px;border-radius:18px;background:var(--card)}.panel h3{margin:0 0 10px}label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
.panel input:not([type=checkbox]),.panel textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.hint{color:var(--mut);font-size:13px}.empty{text-align:center;padding:60px 30px;color:var(--mut)}
.sk{background:linear-gradient(100deg,var(--card) 30%,#262238 50%,var(--card) 70%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:14px}.c0{flex:none;width:108px;aspect-ratio:2/3}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:#15121f;padding:10px 18px;border-radius:99px;font-weight:600;z-index:20;display:none;max-width:90%}
.dr{position:fixed;inset:0;z-index:12;pointer-events:none}.dr .bk{position:absolute;inset:0;width:100%;height:100%;background:rgba(0,0,0,.55);opacity:0;transition:opacity .3s}
.dr .pn{position:absolute;top:0;bottom:0;left:0;width:78%;max-width:320px;background:#141120;border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .34s cubic-bezier(.3,.8,.3,1);padding:calc(18px + env(safe-area-inset-top)) 12px 24px;overflow:auto}
.dr.open{pointer-events:auto}.dr.open .bk{opacity:1}.dr.open .pn{transform:none}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:13px 12px;border-radius:14px;font-weight:600}.mi:active,.mi.on{background:var(--card)}.mi.on{color:var(--acc)}.mi small{margin-left:auto;color:var(--mut);font-weight:500}.ml{margin:18px 12px 6px;color:var(--mut);font-size:12px;font-weight:600}
.fi{animation:fi .22s ease-out}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){header,nav .ind,nav button svg,.dr .bk,.dr .pn,.fi{transition:none;animation:none}}
.eps{padding:0 18px}.eps h4{margin:16px 0 8px;font-size:15px}.ep{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border-radius:14px;background:var(--card);margin-bottom:8px}
.epb{display:flex;flex:1;align-items:center;gap:12px;min-width:0;padding:10px 8px}.epb b{color:var(--acc);min-width:34px}.epb span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tgl{color:var(--mut);font-size:12.5px;font-weight:600;text-decoration:none}
.panel select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.stage{position:sticky;top:0;z-index:3;aspect-ratio:16/9;background:#000}.stage .close{position:absolute;top:10px;left:10px;width:38px;height:38px;font-size:18px}
.pv{position:absolute;inset:0}.pv video,.pv iframe{width:100%;height:100%;border:0;background:#000}
.cover{position:absolute;inset:0;background-size:cover;background-position:center;display:grid;place-items:center}.cover::before{content:"";position:absolute;inset:0;background:rgba(15,13,22,.55);backdrop-filter:blur(14px)}
.bigplay{position:relative;width:64px;height:64px;border-radius:50%;background:var(--acc);color:#1a1200;display:grid;place-items:center;box-shadow:0 8px 28px rgba(232,176,74,.4)}.bigplay svg{width:30px;height:30px}.soon{position:relative;color:var(--mut);font-weight:600}
.wp{padding:14px 16px 30px}.wp h1{font:700 22px/1.2 "Avenir Next","Segoe UI",system-ui,sans-serif;letter-spacing:-.3px;margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:0 10px;color:var(--mut);font-size:13px}.meta span+span::before{content:"";display:inline-block;width:1px;height:10px;background:var(--mut);opacity:.5;margin-right:10px;vertical-align:middle}
.now{margin:10px 0 0;color:var(--acc);font-weight:600;font-size:13.5px}
.ds{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:#cfc9e0;margin:10px 0 0;font-size:14px;width:100%}.ds.open{-webkit-line-clamp:unset}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:99px;background:var(--card);color:var(--txt);font-size:13.5px;font-weight:600;text-decoration:none}.pill svg{width:18px;height:18px}.pill.on{color:var(--acc)}.pill.on svg{fill:currentColor}.pill.bad{color:var(--bad)}.pill[hidden]{display:none}
.h2{margin:18px 0 10px!important}.selrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}.sel{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.tabs{margin:22px 0 10px;border-bottom:1px solid var(--line)}.tabs span{display:inline-block;padding:0 2px 10px;font-weight:700;border-bottom:3px solid var(--acc);margin-bottom:-1px}.wp .grid{padding:8px 0 0}
.dds{display:flex;gap:10px;margin:0 0 12px}
.dd{display:inline-flex;align-items:center;gap:10px;padding:11px 12px 11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}.dd svg{width:18px;height:18px;color:var(--mut)}.dd:active{border-color:var(--acc)}
.rg{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}.rg::-webkit-scrollbar{display:none}.rc{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:600}.rc.on{border-color:var(--acc);color:var(--acc)}
.ecg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ec{position:relative;height:46px;min-width:0;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;font-weight:700;font-size:15px;color:var(--txt);transition:transform .15s,background .2s}.ec:active{transform:scale(.94)}
.ec.seen{color:var(--mut)}.ec.seen::after{content:"";position:absolute;right:6px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--mut);opacity:.6}
.ec.on{background:linear-gradient(135deg,rgba(232,176,74,.28),rgba(232,176,74,.1));border-color:var(--acc);color:var(--acc)}
.pk{position:fixed;inset:0;z-index:40}.pk[hidden]{display:none}.pkb{position:absolute;inset:0;width:100%;height:100%;background:rgba(0,0,0,.6)}
.pkp{position:absolute;left:0;right:0;bottom:0;max-height:62vh;overflow:auto;background:#17142a;border-radius:22px 22px 0 0;padding:8px 14px calc(18px + env(safe-area-inset-bottom));animation:up .26s ease-out}
.pkh{padding:14px 6px 8px;font-weight:700;font-size:16px}.po{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 12px;border-radius:12px;font-weight:600}.po.on{color:var(--acc);background:rgba(232,176,74,.1)}.po i{font-style:normal}
</style>

<body>
<header id="hd"></header>
<main id="main"></main>
<nav id="nv"></nav>
<div class="dr" id="dr"><button class="bk" data-dr="0" aria-label="Close menu"></button><aside class="pn" id="pn"></aside></div><div class="pk" id="pk" hidden><button class="pkb" data-pkc="1" aria-label="Close"></button><div class="pkp"><div class="pkh" id="pkh"></div><div id="pko"></div></div></div><div id="sheet" class="sheet" hidden></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[],tab='home',cat='All',q='',prev={},timer,loading=true,demo=[],CFG={},tf='all',cur=null,sel={};
const layers=[];const pushL=n=>{if(!layers.includes(n)){layers.push(n);history.pushState({l:n},'')}};
const hideL=n=>{if(n==='sheet'){pstop();$('#sheet').hidden=true}else if(n==='dr')$('#dr').classList.remove('open');else if(n==='pk')$('#pk').hidden=true};
const closeL=n=>{if(layers[layers.length-1]===n)history.back();else{const i=layers.indexOf(n);if(i>=0)layers.splice(i,1);hideL(n)}};
const TY={movie:'Movie',series:'Series',anime:'Anime'},ty=i=>i.type||'movie',vurl=u=>/^https?:/.test(u)?u:(CFG.videoBase||'').replace(/\/?$/,'/')+u;
const tgl=c=>{c=(c||'').trim();if(!c)return '';if(/^https?:\/\//.test(c))return c;if(/^t\.me\//.test(c))return 'https://'+c;return CFG.telegramBot?`https://t.me/${CFG.telegramBot.replace('@','')}?start=${encodeURIComponent(c)}`:''};
const eps=it=>it.seasons?it.seasons.flatMap(se=>(se.episodes||[]).map(e=>({t:`S${se.n} E${e.n}${e.lang?' ['+e.lang+']':''}${e.title?' - '+e.title:''}`,u:e.url,tg:e.tg||it.tg,s:se.n,n:e.n,l:e.lang||''}))):(it.src?[{t:it.title,u:it.src,tg:it.tg}]:[]);
const parseEps=t=>t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split('|').map(z=>z.trim());return p.length===1?{url:p[0]}:{title:p[0],url:p[1],tg:p[2]||''}});
const addEps=(x,list,sn,lang='')=>{const seasons=JSON.parse(JSON.stringify(x.seasons||[]));let se=seasons.find(z=>z.n===sn);if(!se){se={n:sn,episodes:[]};seasons.push(se);seasons.sort((a,b)=>a.n-b.n)}list.forEach(e=>se.episodes.push({n:se.episodes.filter(z=>(z.lang||'')===lang).length+1,...e,...(lang?{lang}:{})}));return {...x,seasons}};
const I={chev:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',play:'<svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M8 5v14l11-7z"/></svg>',menu:'<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',home:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>',search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>',grid:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>',heart:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',up:'<svg viewBox="0 0 24 24"><path d="M12 16V5m0 0L7 10m5-5l5 5M5 20h14"/></svg>'};
let fav=[];try{fav=JSON.parse(localStorage.getItem('cb-fav')||'[]')}catch(_){}
const isFav=id=>fav.includes(id),isNew=i=>Date.now()-(i.added||0)<6048e5;
function toggleFav(id){fav=isFav(id)?fav.filter(x=>x!==id):[...fav,id];try{localStorage.setItem('cb-fav',JSON.stringify(fav))}catch(_){}}
const gh=()=>JSON.parse(localStorage.getItem('gh')||'{}'),admin=()=>{const c=gh();return !!(c.token&&c.owner&&c.repo)};
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,''))));
const src=i=>prev[i.id]||encodeURI(i.img);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
async function api(path,o={}){const c=gh(),r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}${o.q||''}`,{method:o.method||'GET',headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},body:o.body&&JSON.stringify(o.body)});
 if(r.status===404&&!o.method)return null;if(!r.ok)throw new Error((await r.json().catch(()=>({}))).message||('Error '+r.status));return r.json()}
async function load(){let d=null,err='';try{if(admin()){const f=await api('data.json',{q:'?ref='+gh().branch});if(f)d=JSON.parse(dec(f.content))}}catch(e){err=e.message}
 if(!d){try{const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);d=await r.json()}catch(e){err=e.message}}
 if(d){try{localStorage.setItem('cb-data',JSON.stringify(d))}catch(_){}}else{try{d=JSON.parse(localStorage.getItem('cb-data')||'null')}catch(_){}if(!d){d={items:[]};toast('Could not load content: '+err)}}
 let dm=[];try{if(!localStorage.getItem('cb-nodemo')){const r=await fetch('demo.json');if(r.ok)dm=(await r.json()).items||[]}}catch(_){}
 try{const r=await fetch('config.json',{cache:'no-store'});if(r.ok)CFG=await r.json()}catch(_){}
 demo=dm;items=[...(d.items||[]),...demo];loading=false;render()}
async function saveJson(path,fn,msg){for(let t=0;t<2;t++){const c=gh(),f=await api(path,{q:'?ref='+c.branch}),d=f?JSON.parse(dec(f.content)):null,nd=fn(d);try{await api(path,{method:'PUT',body:{message:msg,content:enc(JSON.stringify(nd,null,1)),branch:c.branch,...(f?{sha:f.sha}:{})}});return nd}catch(e){if(t)throw e}}}
async function saveData(fn,msg){const nd=await saveJson('data.json',d=>({...(d||{}),items:fn((d||{}).items||[])}),msg);items=[...nd.items,...demo]}
