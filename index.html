<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0d16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>CineBox</title>
<style>
:root{--bg:#0f0d16;--card:#1a1725;--line:#2a2638;--txt:#f3f0fa;--mut:#9a94b0;--acc:#e8b04a;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.5px}.logo b{color:var(--acc)}
.ico{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:18px}
.hero{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:6px 16px 0;scrollbar-width:none}
.hero::-webkit-scrollbar,.row::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/10;border-radius:22px;background-size:cover;background-position:center;position:relative;overflow:hidden;text-align:left}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(15,13,22,.95),rgba(15,13,22,.05) 65%)}
.slide div{position:absolute;left:16px;right:16px;bottom:14px;z-index:1}
.slide h2{margin:0 0 4px;font-size:24px;letter-spacing:-.4px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:rgba(232,176,74,.18);color:var(--acc);font-size:12px;font-weight:600;margin-right:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px;scrollbar-width:none}
.chip{flex:none;padding:7px 16px;border-radius:99px;background:var(--card);color:var(--mut);font-weight:600}
.chip.on{background:var(--acc);color:#1a1200}
h3{margin:6px 16px 10px;font-size:18px;letter-spacing:-.2px}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 16px 18px;scrollbar-width:none}
.card{flex:none;width:132px;text-align:left}
.card img,.grid .card img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:14px;background:var(--card);display:block}
.card span{display:block;margin-top:6px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 10px;padding:0 16px}
.grid .card{width:auto}
.search{margin:8px 16px 16px;display:block;width:calc(100% - 32px);padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(26,23,37,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;display:grid;justify-items:center;gap:2px;color:var(--mut);font-size:12px;font-weight:600}
nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--acc)}
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet img{width:100%;max-height:70vh;object-fit:cover;display:block}
.sheet .in{padding:16px 16px 40px}.sheet h1{margin:0 0 8px;font-size:26px;letter-spacing:-.5px}
.close{position:fixed;top:calc(12px + env(safe-area-inset-top));left:14px;width:40px;height:40px;border-radius:50%;background:rgba(15,13,22,.7);backdrop-filter:blur(8px);font-size:20px;z-index:11}
.btn{display:inline-block;padding:12px 20px;border-radius:14px;background:var(--acc);color:#1a1200;font-weight:700;text-decoration:none;margin:8px 8px 0 0}
.btn.alt{background:var(--card);color:var(--txt)}.btn.bad{background:rgba(255,107,107,.15);color:var(--bad)}
.panel{margin:0 16px 16px;padding:16px;border-radius:18px;background:var(--card)}
.panel h3{margin:0 0 10px}label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
.panel input:not([type=checkbox]),.panel textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.hint{color:var(--mut);font-size:13px}.empty{text-align:center;padding:60px 30px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:#15121f;padding:10px 18px;border-radius:99px;font-weight:600;z-index:20;display:none;max-width:90%}
</style>
</head>
<body>
<header><div class="logo">Cine<b>Box</b></div><button class="ico" data-tab="search" aria-label="Search">🔍</button></header>
<main id="main"></main>
<nav><button data-tab="home"><i>🏠</i>Home</button><button data-tab="search"><i>🔍</i>Search</button><button data-tab="admin"><i>⬆️</i>Upload</button></nav>
<div id="sheet" class="sheet" hidden></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[],tab='home',cat='All',q='',prev={},timer;
const gh=()=>JSON.parse(localStorage.getItem('gh')||'{}'),admin=()=>{const c=gh();return !!(c.token&&c.owner&&c.repo)};
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,''))));
const src=i=>prev[i.id]||encodeURI(i.img);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
async function api(path,o={}){const c=gh(),r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}${o.q||''}`,{method:o.method||'GET',headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},body:o.body&&JSON.stringify(o.body)});
 if(r.status===404&&!o.method)return null;if(!r.ok)throw new Error((await r.json().catch(()=>({}))).message||('Error '+r.status));return r.json()}
async function load(){let d=null,err='';try{if(admin()){const f=await api('data.json',{q:'?ref='+gh().branch});if(f)d=JSON.parse(dec(f.content))}}catch(e){err=e.message}
 if(!d){try{const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);d=await r.json()}catch(e){err=e.message}}
 if(d){try{localStorage.setItem('cb-data',JSON.stringify(d))}catch(_){}}else{try{d=JSON.parse(localStorage.getItem('cb-data')||'null')}catch(_){}if(!d){d={items:[]};toast('Could not load content: '+err)}}
 items=d.items||[];render()}
async function saveData(fn,msg){for(let t=0;t<2;t++){const c=gh(),f=await api('data.json',{q:'?ref='+c.branch}),d=f?JSON.parse(dec(f.content)):{items:[]};
 d.items=fn(d.items||[]);try{await api('data.json',{method:'PUT',body:{message:msg,content:enc(JSON.stringify(d,null,1)),branch:c.branch,...(f?{sha:f.sha}:{})}});items=d.items;return}catch(e){if(t)throw e}}}
function shrink(file,max=1280){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};im.onerror=()=>no(new Error('Not a valid image'));im.src=URL.createObjectURL(file)})}
const cats=()=>[...new Set(items.map(i=>i.cat).filter(Boolean))];
const card=i=>`<button class="card" data-id="${esc(i.id)}"><img loading="lazy" decoding="async" alt="" src="${esc(src(i))}"><span>${esc(i.title)}</span><small>${esc(i.year||'')}</small></button>`;
function home(){if(!items.length)return `<div class="empty"><h3>No content yet</h3>Open the Upload tab to add your first image.</div>`;
 const f=items.filter(i=>i.featured).slice(0,6),h=f.length?f:items.slice(0,5);
 const hero=`<div class="hero" id="hero">${h.map(i=>`<button class="slide" data-id="${esc(i.id)}" style="background-image:url('${esc(src(i))}')"><div><span class="tag">${esc(i.cat)}</span><h2>${esc(i.title)}</h2></div></button>`).join('')}</div>`;
 const chips=`<div class="chips">${['All',...cats()].map(c=>`<button class="chip ${c===cat?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
 let body;if(cat!=='All')body=`<div class="grid">${items.filter(i=>i.cat===cat).map(card).join('')}</div>`;
 else body=`<h3>Latest</h3><div class="row">${items.slice(0,12).map(card).join('')}</div>`+cats().map(c=>`<h3>${esc(c)}</h3><div class="row">${items.filter(i=>i.cat===c).map(card).join('')}</div>`).join('');
 return hero+chips+body}
function search(){const r=items.filter(i=>(i.title+' '+i.cat+' '+(i.desc||'')).toLowerCase().includes(q.toLowerCase()));
 return `<input class="search" id="q" type="search" placeholder="Search titles and categories" value="${esc(q)}"><div class="grid" id="res">${r.map(card).join('')||'<div class="empty" style="grid-column:1/-1">Nothing matches your search.</div>'}</div>`}
function adminView(){const c=gh(),m=location.hostname.endsWith('github.io');const o=c.owner||(m?location.hostname.split('.')[0]:''),r=c.repo||(m?location.pathname.split('/')[1]||'':'');
 const conn=`<div class="panel"><h3>GitHub connection</h3><p class="hint">Stays on this phone only. Use a fine-grained token limited to this repo with Contents: read and write.</p>
 <label>Username</label><input id="g-o" value="${esc(o)}" autocapitalize="off"><label>Repository</label><input id="g-r" value="${esc(r)}" autocapitalize="off"><label>Branch</label><input id="g-b" value="${esc(c.branch||'main')}" autocapitalize="off"><label>Token</label><input id="g-t" type="password" value="${esc(c.token||'')}" autocomplete="off">
 <button class="btn" id="g-save">Save connection</button>${admin()?'<button class="btn alt" id="g-out">Disconnect</button>':''}</div>`;
 if(!admin())return conn;
 return `<div class="panel"><h3>Upload image</h3><label>Image</label><input id="u-f" type="file" accept="image/*"><label>Title</label><input id="u-t"><label>Category</label><input id="u-c" list="cl" placeholder="Drama, Romance...">
 <datalist id="cl">${cats().map(c=>`<option value="${esc(c)}">`).join('')}</datalist><label>Year</label><input id="u-y" inputmode="numeric" value="${new Date().getFullYear()}"><label>Description</label><textarea id="u-d" rows="3"></textarea>
 <label><input type="checkbox" id="u-ft"> Show on the home banner</label><button class="btn" id="u-go">Publish</button><p class="hint" id="u-s">New uploads go live on the site in about a minute.</p></div>`+conn}
function render(){$('#main').innerHTML=tab==='home'?home():tab==='search'?search():adminView();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 clearInterval(timer);const h=$('#hero');if(h&&h.children.length>1&&!matchMedia('(prefers-reduced-motion:reduce)').matches)timer=setInterval(()=>{const w=h.firstElementChild.offsetWidth+10;h.scrollTo({left:h.scrollLeft+w>=h.scrollWidth-5?0:h.scrollLeft+w,behavior:'smooth'})},4500)}
function openItem(id){const i=items.find(x=>x.id===id);if(!i)return;const s=$('#sheet');
 s.innerHTML=`<button class="close" aria-label="Close">✕</button><img alt="${esc(i.title)}" src="${esc(src(i))}"><div class="in"><h1>${esc(i.title)}</h1><span class="tag">${esc(i.cat)}</span><span class="hint">${esc(i.year||'')}</span><p>${esc(i.desc||'')}</p>
 <a class="btn" href="${esc(src(i))}" download="${esc(i.id)}.jpg">Save image</a>${admin()?`<button class="btn bad" data-del="${esc(i.id)}">Delete</button>`:''}</div>`;s.hidden=false;s.scrollTop=0}
const closeSheet=()=>{$('#sheet').hidden=true};
document.addEventListener('click',async e=>{const t=e.target.closest('button,a');if(!t)return;
 if(t.classList.contains('close'))return closeSheet();
 if(t.dataset.tab){tab=t.dataset.tab;closeSheet();return render()}
 if(t.dataset.cat){cat=t.dataset.cat;return render()}
 if(t.dataset.id)return openItem(t.dataset.id);
 if(t.dataset.del){if(!confirm('Delete this item permanently?'))return;const i=items.find(x=>x.id===t.dataset.del);t.disabled=true;
  try{await saveData(l=>l.filter(x=>x.id!==i.id),'Remove '+i.title);const c=gh(),f=await api(i.img,{q:'?ref='+c.branch}).catch(()=>null);if(f)await api(i.img,{method:'DELETE',body:{message:'Delete image',sha:f.sha,branch:c.branch}});closeSheet();render();toast('Deleted')}catch(x){toast(x.message);t.disabled=false}return}
 if(t.id==='g-save'){localStorage.setItem('gh',JSON.stringify({owner:$('#g-o').value.trim(),repo:$('#g-r').value.trim(),branch:$('#g-b').value.trim()||'main',token:$('#g-t').value.trim()}));toast('Connection saved');load()}
 if(t.id==='g-out'){localStorage.removeItem('gh');toast('Disconnected');load()}
 if(t.id==='u-go'){const f=$('#u-f').files[0],title=$('#u-t').value.trim(),st=$('#u-s');if(!f||!title)return toast('Choose an image and add a title');
  t.disabled=true;try{st.textContent='Compressing image...';const url=await shrink(f),id=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)+'-'+Date.now().toString(36),path='images/'+id+'.jpg',c=gh();
   st.textContent='Uploading image...';await api(path,{method:'PUT',body:{message:'Add image '+title,content:url.split(',')[1],branch:c.branch}});
   const it={id,title,cat:$('#u-c').value.trim()||'General',year:$('#u-y').value.trim(),desc:$('#u-d').value.trim(),img:path,featured:$('#u-ft').checked,added:Date.now()};
   st.textContent='Updating catalog...';await saveData(l=>[it,...l],'Add '+title);prev[id]=url;toast('Published');tab='home';render()}catch(x){st.textContent=x.message;toast('Upload failed')}t.disabled=false}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#res').innerHTML=items.filter(i=>(i.title+' '+i.cat+' '+(i.desc||'')).toLowerCase().includes(q.toLowerCase())).map(card).join('')||'<div class="empty" style="grid-column:1/-1">Nothing matches your search.</div>'}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
</body>
</html>
